<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders | Blossom Flower Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #fff5f8;

            color: #333;

            min-height: 100vh;

        }

        .navbar {

            background: white;

            padding: 20px 50px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 100;

        }

        .logo {

            color: #d63384;

            font-size: 25px;

            font-weight: bold;

        }

        nav ul {

            list-style: none;

            display: flex;

            gap: 25px;

        }

        nav ul li a {

            text-decoration: none;

            color: #444;

            font-weight: 600;

            transition: 0.3s;

        }

        nav ul li a:hover {

            color: #d63384;

        }

        .orders-section {

            max-width: 1100px;

            margin: 45px auto;

            padding: 0 20px;

        }

        .page-title {

            background: white;

            padding: 25px;

            border-radius: 15px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.07);

        }

        .page-title h2 {

            color: #c2185b;

            margin-bottom: 7px;

        }

        .page-title p {

            color: #777;

        }

        .order-card {

            background: white;

            border-radius: 16px;

            padding: 25px;

            margin-bottom: 22px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);

            border-left:
                5px solid #d63384;

        }

        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            border-bottom:
                1px solid #eee;

            padding-bottom: 15px;

            margin-bottom: 18px;

        }

        .order-header h3 {

            color: #c2185b;

            font-size: 19px;

        }

        .status-btn {

            border: none;

            background: #fff0c2;

            color: #946200;

            padding: 8px 15px;

            border-radius: 20px;

            font-weight: bold;

        }

        .order-details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 20px;

        }

        .detail-box {

            background: #fff8fa;

            border:
                1px solid #f5d8e2;

            padding: 13px;

            border-radius: 9px;

        }

        .detail-box strong {

            color: #c2185b;

        }

        .products-title {

            color: #c2185b;

            margin-bottom: 12px;

            font-size: 18px;

        }

        .product-list {

            border:
                1px solid #eee;

            border-radius: 10px;

            overflow: hidden;

        }

        .product-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 14px;

            border-bottom:
                1px solid #eee;

            gap: 15px;

        }

        .product-item:last-child {

            border-bottom: none;

        }

        .product-name {

            font-weight: bold;

            color: #555;

        }

        .product-quantity {

            color: #777;

            font-size: 14px;

            margin-top: 5px;

        }

        .product-price {

            font-weight: bold;

            color: #d63384;

        }

        .order-footer {

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid #eee;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }

        .order-total {

            color: #c2185b;

            font-size: 21px;

            font-weight: bold;

        }

        .delete-btn {

            border: none;

            background: #ffe0e8;

            color: #c2185b;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

        }

        .empty-order {

            background: white;

            text-align: center;

            padding: 60px 25px;

            border-radius: 16px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);

        }

        .empty-order h2 {

            color: #d63384;

            margin-bottom: 10px;

        }

        .empty-order p {

            color: #777;

            margin-bottom: 20px;

        }

        .shop-btn {

            display: inline-block;

            text-decoration: none;

            background: #d63384;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            font-weight: bold;

        }

        .loading {

            text-align: center;

            background: white;

            padding: 40px;

            border-radius: 15px;

            color: #777;

        }

        .error-box {

            text-align: center;

            background: white;

            padding: 40px;

            border-radius: 15px;

            color: #c2185b;

        }

        @media (max-width: 700px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

                padding: 20px;

            }

            nav ul {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;

            }

            .order-details {

                grid-template-columns: 1fr;

            }

            .product-item {

                flex-direction: column;

                align-items: flex-start;

            }

            .order-footer {

                flex-direction: column;

                align-items: stretch;

            }

            .delete-btn {

                width: 100%;

            }

        }

    </style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        🌸 Blossom Flower Shop
    </div>

    <nav>

        <ul>

            <li>
                <a href="{{ url_for('dashboard_page') }}">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="{{ url_for('home_page') }}">
                    Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('flowers_page') }}">
                    Flowers
                </a>
            </li>

            <li>
                <a href="{{ url_for('cart_page') }}">
                    Cart
                </a>
            </li>

            <li>
                <a href="{{ url_for('orders_page') }}">
                    Orders
                </a>
            </li>

        </ul>

    </nav>

</header>

<section class="orders-section">

    <div class="page-title">

        <h2>
            📦 Order History
        </h2>

        <p>
            View all your previously placed orders.
        </p>

    </div>

    <div id="ordersContainer">

        <div class="loading">
            Loading orders...
        </div>

    </div>

</section>

<script>

const API_URL =
    "http://127.0.0.1:5000";

function getCurrentUser() {

    const userData =
        localStorage.getItem(
            "currentUser"
        );

    if (!userData) {

        return null;

    }

    try {

        return JSON.parse(
            userData
        );

    } catch (error) {

        return null;

    }

}

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );

    const user =
        getCurrentUser();

    if (
        !user ||
        !user.id
    ) {

        container.innerHTML = `

            <div class="empty-order">

                <h2>
                    🌸 Please Login
                </h2>

                <p>
                    Login to view your orders.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="shop-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;

    }

    try {

        const response =
            await fetch(
                `${API_URL}/api/orders/${user.id}`
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load orders"
            );

        }

        displayOrders(
            data.orders || []
        );

    } catch (error) {

        console.error(
            "Orders Error:",
            error
        );

        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Orders
                </h2>

                <p>
                    Please make sure Flask server is running.
                </p>

                <br>

                <button
                    class="shop-btn"
                    onclick="loadOrders()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}

function displayOrders(
    orders
) {

    const container =
        document.getElementById(
            "ordersContainer"
        );

    container.innerHTML = "";

    if (
        !orders ||
        orders.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-order">

                <h2>
                    📦 No Orders Found
                </h2>

                <p>
                    Your placed orders will appear here.
                </p>

                <a
                    href="{{ url_for('flowers_page') }}"
                    class="shop-btn"
                >
                    🌸 Shop Flowers
                </a>

            </div>

        `;

        return;

    }

    orders.forEach(
        function(order) {

            let productsHTML = "";

            if (
                order.items &&
                order.items.length > 0
            ) {

                order.items.forEach(
                    function(item) {

                        productsHTML += `

                            <div class="product-item">

                                <div>

                                    <div class="product-name">

                                        🌸
                                        ${escapeHtml(
                                            item.name
                                        )}

                                    </div>

                                    <div class="product-quantity">

                                        Quantity:
                                        ${item.quantity}

                                    </div>

                                </div>

                                <div class="product-price">

                                    ₹${Number(
                                        item.subtotal || 0
                                    ).toFixed(2)}

                                </div>

                            </div>

                        `;

                    }
                );

            }

            const date =
                formatDate(
                    order.created_at
                );

            container.innerHTML += `

                <div
                    class="order-card"
                    data-order-id="${order.id}"
                >

                    <div class="order-header">

                        <h3>

                            Order ID :
                            ${order.id}

                        </h3>

                        <button
                            class="status-btn"
                        >

                            ${escapeHtml(
                                order.status ||
                                "Processing"
                            )}

                        </button>

                    </div>

                    <div class="order-details">

                        <div class="detail-box">

                            <strong>
                                Customer
                            </strong>

                            <br>

                            ${escapeHtml(
                                order.customer_name
                            )}

                        </div>

                        <div class="detail-box">

                            <strong>
                                Phone
                            </strong>

                            <br>

                            ${escapeHtml(
                                order.phone
                            )}

                        </div>

                        <div class="detail-box">

                            <strong>
                                Payment
                            </strong>

                            <br>

                            ${escapeHtml(
                                order.payment
                            )}

                        </div>

                        <div class="detail-box">

                            <strong>
                                Date
                            </strong>

                            <br>

                            ${date}

                        </div>

                        <div
                            class="detail-box"
                            style="grid-column: 1 / -1;"
                        >

                            <strong>
                                Delivery Address
                            </strong>

                            <br>

                            ${escapeHtml(
                                order.address
                            )}

                        </div>

                    </div>

                    <h3 class="products-title">

                        🌸 Ordered Products

                    </h3>

                    <div class="product-list">

                        ${productsHTML}

                    </div>

                    <div class="order-footer">

                        <div class="order-total">

                            Total :
                            ₹${Number(
                                order.total || 0
                            ).toFixed(2)}

                        </div>

                        <button
                            class="delete-btn"
                            onclick="deleteOrder(${order.id})"
                        >

                            🗑 Delete Order

                        </button>

                    </div>

                </div>

            `;

        }
    );

}

async function deleteOrder(
    orderId
) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this order?"
        );

    if (!confirmDelete) {

        return;

    }

    try {

        const response =
            await fetch(
                `${API_URL}/api/orders/${orderId}`,
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to delete order"
            );

        }

        alert(
            "Order deleted successfully."
        );

        loadOrders();

    } catch (error) {

        console.error(
            error
        );

        alert(
            error.message ||
            "Unable to delete order."
        );

    }

}

function formatDate(
    dateString
) {

    if (!dateString) {

        return "-";

    }

    const date =
        new Date(
            dateString.replace(
                " ",
                "T"
            )
        );

    if (
        isNaN(
            date.getTime()
        )
    ) {

        return dateString;

    }

    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}

function escapeHtml(
    text
) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadOrders();

    }
);

</script>

</body>

</html>
