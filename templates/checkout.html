<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Checkout | Blossom Flower Shop
</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #fff5f8;

    color: #333;

    min-height: 100vh;

}

.dashboard-header {

    background: white;

    padding: 20px 50px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    box-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.08);

    position: sticky;

    top: 0;

    z-index: 100;

}

.dashboard-header h1 {

    color: #d63384;

    font-size: 27px;

}

nav {

    display: flex;

    gap: 25px;

    align-items: center;

}

nav a {

    text-decoration: none;

    color: #444;

    font-weight: 600;

}

nav a:hover {

    color: #d63384;

}

.checkout-section {

    width: 100%;

    padding: 50px 20px;

}

.checkout-container {

    max-width: 950px;

    margin: auto;

    background: white;

    padding: 35px;

    border-radius: 18px;

    box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);

}

.checkout-container h2 {

    color: #c2185b;

    margin-bottom: 25px;

    border-bottom:
        2px solid #f3c1d3;

    padding-bottom: 12px;

}

.form-group {

    margin-bottom: 20px;

}

.form-group label {

    display: block;

    margin-bottom: 8px;

    font-weight: bold;

    color: #555;

}

input,
textarea,
select {

    width: 100%;

    padding: 13px 15px;

    border:
        1px solid #ddd;

    border-radius: 9px;

    font-size: 15px;

    outline: none;

}

input:focus,
textarea:focus,
select:focus {

    border-color: #d63384;

}

textarea {

    min-height: 110px;

    resize: vertical;

}

.summary-title {

    margin-top: 30px;

    margin-bottom: 15px;

    color: #c2185b;

}

#checkoutItems {

    border:
        1px solid #eee;

    border-radius: 12px;

    overflow: hidden;

}

.checkout-item {

    display: flex;

    align-items: center;

    gap: 18px;

    padding: 18px;

    border-bottom:
        1px solid #eee;

}

.checkout-item:last-child {

    border-bottom: none;

}

.checkout-item img {

    width: 80px;

    height: 80px;

    object-fit: cover;

    border-radius: 10px;

}

.checkout-item-info {

    flex: 1;

}

.checkout-item-info h4 {

    color: #c2185b;

    margin-bottom: 7px;

}

.checkout-item-info p {

    color: #666;

    margin: 4px 0;

    font-size: 14px;

}

.item-price {

    font-weight: bold;

    color: #d63384;

    font-size: 18px;

}

.ordered-badge {

    display: inline-block;

    margin-top: 8px;

    padding: 5px 10px;

    background: #e8f7ed;

    color: #218838;

    border:
        1px solid #b7e4c7;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

}

.order-summary {

    margin-top: 25px;

    padding: 22px;

    background: #fff5f8;

    border:
        1px solid #f4c8d9;

    border-radius: 12px;

}

.order-summary h3 {

    color: #c2185b;

    display: flex;

    justify-content: space-between;

}

#checkoutTotal {

    color: #d63384;

    font-size: 24px;

}

.button-row {

    display: flex;

    gap: 15px;

    margin-top: 25px;

}

.btn {

    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 9px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    text-align: center;

    text-decoration: none;

}

.btn-primary {

    background: #d63384;

    color: white;

}

.btn-primary:hover {

    background: #ad1457;

}

.btn-primary:disabled {

    background: #c9a0b2;

    cursor: not-allowed;

}

.btn-secondary {

    background: #ffe0ea;

    color: #c2185b;

}

.empty-checkout {

    text-align: center;

    padding: 40px 20px;

}

.empty-checkout h2 {

    color: #d63384;

    margin-bottom: 10px;

}

.empty-checkout p {

    color: #666;

    margin-bottom: 20px;

}

.loading {

    text-align: center;

    padding: 30px;

    color: #777;

}

.success-message {

    display: none;

    margin-bottom: 20px;

    padding: 15px 18px;

    background: #e8f7ed;

    border:
        1px solid #b7e4c7;

    color: #218838;

    border-radius: 10px;

    font-weight: bold;

}

.error-message {

    display: none;

    margin-bottom: 20px;

    padding: 15px 18px;

    background: #fff0f0;

    border:
        1px solid #f0b8b8;

    color: #c62828;

    border-radius: 10px;

    font-weight: bold;

}

@media (max-width: 700px) {

    .dashboard-header {

        flex-direction: column;

        gap: 15px;

        padding: 20px;

    }

    nav {

        flex-wrap: wrap;

        justify-content: center;

        gap: 15px;

    }

    .checkout-container {

        padding: 22px;

    }

    .checkout-item {

        align-items: flex-start;

    }

    .button-row {

        flex-direction: column;

    }

}

</style>

</head>


<body>

<header class="dashboard-header">

    <h1>
        💳 Checkout
    </h1>

    <nav>

        <a href="{{ url_for('dashboard_page') }}">
            Dashboard
        </a>

        <a href="{{ url_for('home_page') }}">
            Home
        </a>

        <a href="{{ url_for('flowers_page') }}">
            Flowers
        </a>

        <a href="{{ url_for('cart_page') }}">
            Cart
        </a>

        <a href="{{ url_for('orders_page') }}">
            Orders
        </a>

    </nav>

</header>


<section class="checkout-section">

<div class="checkout-container">

<h2>
    Customer Details
</h2>


<div
    id="successMessage"
    class="success-message"
></div>


<div
    id="errorMessage"
    class="error-message"
></div>


<form id="checkoutForm">

<div class="form-group">

<label for="customerName">
    Full Name
</label>

<input
    type="text"
    id="customerName"
    placeholder="Enter your full name"
    required
>

</div>


<div class="form-group">

<label for="customerPhone">
    Mobile Number
</label>

<input
    type="tel"
    id="customerPhone"
    placeholder="Enter 10 digit mobile number"
    pattern="[0-9]{10}"
    maxlength="10"
    required
>

</div>


<div class="form-group">

<label for="customerAddress">
    Delivery Address
</label>

<textarea
    id="customerAddress"
    placeholder="Enter complete delivery address"
    required
></textarea>

</div>


<div class="form-group">

<label for="paymentMethod">
    Payment Method
</label>

<select
    id="paymentMethod"
    required
>

<option value="Cash On Delivery">
    Cash On Delivery
</option>

<option value="UPI">
    UPI
</option>

<option value="Credit Card">
    Credit Card
</option>

<option value="Debit Card">
    Debit Card
</option>

</select>

</div>


<h3 class="summary-title">
    🌸 Selected Flowers
</h3>


<div id="checkoutItems">

<div class="loading">
    Loading selected flowers...
</div>

</div>


<div class="order-summary">

<h3>

<span>
    Grand Total
</span>

<span>
    ₹<span id="checkoutTotal">0.00</span>
</span>

</h3>

</div>


<div class="button-row">

<a
    href="{{ url_for('cart_page') }}"
    class="btn btn-secondary"
>
    ← Back to Cart
</a>

<button
    type="submit"
    class="btn btn-primary"
    id="placeOrderButton"
>
    🌸 Place Order
</button>

</div>

</form>

</div>

</section>


<script>

const API_URL =
    window.location.origin;


let cart = [];

let selectedCartIds = [];

let total = 0;


function getCurrentUser() {

    const userData =
        localStorage.getItem(
            "currentUser"
        );

    if (!userData) {

        return null;

    }

    try {

        return JSON.parse(
            userData
        );

    } catch {

        return null;

    }

}


function getSelectedIds() {

    const stored =
        sessionStorage.getItem(
            "selectedCartIds"
        );

    if (!stored) {

        return [];

    }

    try {

        const ids =
            JSON.parse(stored);

        return Array.isArray(ids)
            ? ids
                .map(Number)
                .filter(
                    id => !isNaN(id)
                )
            : [];

    } catch {

        return [];

    }

}


function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );

    box.textContent =
        "❌ " + message;

    box.style.display =
        "block";

}


function hideError() {

    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}


function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );

    box.textContent =
        "🌸 " + message;

    box.style.display =
        "block";

}


async function loadCheckoutCart() {

    const user =
        getCurrentUser();


    const container =
        document.getElementById(
            "checkoutItems"
        );


    selectedCartIds =
        getSelectedIds();


    if (
        !user ||
        !user.id
    ) {

        container.innerHTML = `

            <div class="empty-checkout">

                <h2>
                    🌸 Please Login
                </h2>

                <p>
                    Please login before checkout.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="btn btn-primary"
                >
                    Login
                </a>

            </div>

        `;

        disableOrderButton();

        return;

    }


    if (
        selectedCartIds.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-checkout">

                <h2>
                    🛒 No Flowers Selected
                </h2>

                <p>
                    Please go back to cart and select flowers.
                </p>

                <a
                    href="{{ url_for('cart_page') }}"
                    class="btn btn-primary"
                >
                    ← Go To Cart
                </a>

            </div>

        `;

        disableOrderButton();

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${user.id}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load cart."
            );

        }


        const allCart =
            data.cart || [];


        cart =
            allCart.filter(
                item =>
                    selectedCartIds.includes(
                        Number(item.id)
                    )
            );


        total = 0;


        cart.forEach(
            item => {

                total +=
                    Number(
                        item.subtotal || 0
                    );

            }
        );


        displayCheckoutCart();

    }

    catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="empty-checkout">

                <h2>
                    ❌ Unable to Load Flowers
                </h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

                <a
                    href="{{ url_for('cart_page') }}"
                    class="btn btn-primary"
                >
                    ← Back To Cart
                </a>

            </div>

        `;

        disableOrderButton();

    }

}


function displayCheckoutCart() {

    const container =
        document.getElementById(
            "checkoutItems"
        );


    document.getElementById(
        "checkoutTotal"
    ).textContent =
        total.toFixed(2);


    if (
        cart.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-checkout">

                <h2>
                    🛒 Selected Flowers Not Found
                </h2>

                <p>
                    Please return to cart and select again.
                </p>

            </div>

        `;

        disableOrderButton();

        return;

    }


    container.innerHTML = "";


    cart.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "checkout-item";


            card.innerHTML = `

                <img
                    src="${escapeHtml(item.image || '')}"
                    alt="${escapeHtml(item.name)}"
                >

                <div class="checkout-item-info">

                    <h4>
                        🌸
                        ${escapeHtml(item.name)}
                    </h4>

                    <p>
                        Price:
                        ₹${Number(
                            item.price || 0
                        ).toFixed(2)}
                    </p>

                    <p>
                        Quantity:
                        ${item.quantity}
                    </p>

                    <span class="ordered-badge">
                        ✓ Ready To Order
                    </span>

                </div>

                <div class="item-price">
                    ₹${Number(
                        item.subtotal || 0
                    ).toFixed(2)}
                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


document
    .getElementById(
        "checkoutForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            hideError();


            const user =
                getCurrentUser();


            if (
                !user ||
                !user.id
            ) {

                showError(
                    "Please login first."
                );

                return;

            }


            if (
                selectedCartIds.length === 0 ||
                cart.length === 0
            ) {

                showError(
                    "Please select at least one flower."
                );

                return;

            }


            const button =
                document.getElementById(
                    "placeOrderButton"
                );


            const customerName =
                document
                    .getElementById(
                        "customerName"
                    )
                    .value
                    .trim();


            const customerPhone =
                document
                    .getElementById(
                        "customerPhone"
                    )
                    .value
                    .trim();


            const customerAddress =
                document
                    .getElementById(
                        "customerAddress"
                    )
                    .value
                    .trim();


            const paymentMethod =
                document
                    .getElementById(
                        "paymentMethod"
                    )
                    .value;


            if (
                !/^[0-9]{10}$/.test(
                    customerPhone
                )
            ) {

                showError(
                    "Please enter a valid 10 digit mobile number."
                );

                return;

            }


            button.disabled =
                true;

            button.textContent =
                "Placing Order...";


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/orders`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    user_id:
                                        user.id,

                                    customer_name:
                                        customerName,

                                    phone:
                                        customerPhone,

                                    address:
                                        customerAddress,

                                    payment:
                                        paymentMethod,

                                    cart_ids:
                                        selectedCartIds

                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to place order."
                    );

                }


                if (data.order) {

                    localStorage.setItem(
                        "lastOrder",
                        JSON.stringify(
                            data.order
                        )
                    );

                }


                localStorage.setItem(
                    "cartUpdated",
                    Date.now().toString()
                );


                localStorage.setItem(
                    "orderedCartIds",
                    JSON.stringify(
                        selectedCartIds
                    )
                );


                sessionStorage.removeItem(
                    "selectedCartIds"
                );


                showSuccess(
                    "Order placed successfully!"
                );


                button.textContent =
                    "✓ Order Placed";


                setTimeout(
                    function() {

                        window.location.href =
                            "{{ url_for('orders_page') }}";

                    },
                    1500
                );

            }

            catch (error) {

                console.error(
                    "Order Error:",
                    error
                );


                button.disabled =
                    false;

                button.textContent =
                    "🌸 Place Order";


                showError(
                    error.message ||
                    "Unable to place order."
                );

            }

        }
    );


function disableOrderButton() {

    const button =
        document.getElementById(
            "placeOrderButton"
        );


    if (button) {

        button.disabled =
            true;

    }

}


function prefillUser() {

    const user =
        getCurrentUser();


    if (
        user &&
        user.name
    ) {

        document.getElementById(
            "customerName"
        ).value =
            user.name;

    }

}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        prefillUser();

        loadCheckoutCart();

    }
);

</script>

</body>

</html>
