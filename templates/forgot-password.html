<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password - Blossom Flower Shop
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff0f7,
                    #ffe1ef
                );

        }

        .forgot-container {

            width: 440px;

            max-width: 90%;

            background: #ffffff;

            border-radius: 18px;

            padding: 40px 36px;

            box-shadow:
                0 15px 35px
                rgba(
                    180,
                    80,
                    130,
                    0.18
                );

        }

        .flower-icon {

            text-align: center;

            font-size: 42px;

            margin-bottom: 8px;

        }

        .welcome {

            text-align: center;

            color: #777;

            font-size: 15px;

            margin-bottom: 8px;

        }

        h1 {

            text-align: center;

            margin: 0 0 10px;

            color: #222;

            font-size: 28px;

        }

        .description {

            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #333;

        }

        input {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid #d5d5d5;

            border-radius: 10px;

            background: #f8f9fc;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }

        input:focus {

            border-color: #ff1493;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(
                    255,
                    20,
                    147,
                    0.08
                );

        }

        .reset-btn {

            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 14px;

            background: #ff1493;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;

        }

        .reset-btn:hover {

            background: #e60082;

        }

        .reset-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;

        }

        .message {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

        }

        .message.success {

            display: block;

            background: #eaf8ee;

            color: #1d7a3b;

        }

        .message.error {

            display: block;

            background: #fff0f0;

            color: #c62828;

        }

        .login-link {

            text-align: center;

            margin-top: 24px;

            margin-bottom: 12px;

            font-size: 14px;

        }

        .login-link a {

            color: #ff1493;

            text-decoration: none;

            font-weight: 600;

        }

        .login-link a:hover {

            text-decoration: underline;

        }

        .home-link {

            display: block;

            text-align: center;

            color: #444;

            text-decoration: none;

            font-size: 14px;

            margin-top: 10px;

        }

        .home-link:hover {

            color: #ff1493;

        }

        @media (max-width: 500px) {

            .forgot-container {

                padding: 32px 24px;

            }

        }

    </style>

</head>


<body>

<div class="forgot-container">

    <div class="flower-icon">
        🌸
    </div>

    <div class="welcome">
        Blossom Flower Shop
    </div>

    <h1>
        Forgot Password
    </h1>

    <p class="description">

        Enter your registered email
        and create a new password.

    </p>


    <form id="forgotPasswordForm">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

        </div>


        <div class="form-group">

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                minlength="6"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            class="reset-btn"
            id="resetButton"
        >
            Reset Password
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <p class="login-link">

        Remember your password?

        <a href="/login">
            Login Here
        </a>

    </p>


    <a
        href="/"
        class="home-link"
    >
        ← Back to Registration
    </a>

</div>


<script>

const form =
    document.getElementById(
        "forgotPasswordForm"
    );


const message =
    document.getElementById(
        "message"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const newPassword =
            document
                .getElementById("new_password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirm_password")
                .value;


        message.className =
            "message";

        message.textContent =
            "";


        if (!email) {

            showError(
                "Please enter your email."
            );

            return;

        }


        if (
            newPassword.length < 6
        ) {

            showError(
                "Password must be at least 6 characters."
            );

            return;

        }


        if (
            newPassword !==
            confirmPassword
        ) {

            showError(
                "Passwords do not match."
            );

            return;

        }


        resetButton.disabled =
            true;

        resetButton.textContent =
            "Resetting...";


        try {

            const response =
                await fetch(
                    "/api/forgot-password",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                new_password:
                                    newPassword,

                                confirm_password:
                                    confirmPassword

                            })

                    }
                );


            const data =
                await response.json();


            if (
                response.ok &&
                data.success
            ) {

                message.className =
                    "message success";

                message.textContent =
                    data.message;


                form.reset();


                setTimeout(
                    function() {

                        window.location.href =
                            "/login";

                    },
                    1800
                );


                return;

            }


            showError(
                data.message ||
                "Unable to reset password."
            );

        }

        catch (error) {

            console.error(
                "Forgot Password Error:",
                error
            );


            showError(
                "Unable to connect to Flask server."
            );

        }

        finally {

            resetButton.disabled =
                false;

            resetButton.textContent =
                "Reset Password";

        }

    }
);


function showError(text) {

    message.className =
        "message error";

    message.textContent =
        text;

}

</script>

</body>

</html>
